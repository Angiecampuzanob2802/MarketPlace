<!-- GIF de fondo implementado como div -->
<div class="video-background"></div>

<ion-content [fullscreen]="true">
    <!-- Barra de carga -->
    <ion-progress-bar *ngIf="isLoading" type="indeterminate"></ion-progress-bar>

    <!-- Contenedor de login -->
    <div class="login-container" *ngIf="!isLoading">
        <ion-card class="login-card">
            <ion-card-header>
                <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <ion-icon name="hardware-chip-outline" style="font-size: 24px; color: white;"></ion-icon>
                    <ion-card-title>Technology 🤖</ion-card-title>
                </div>
            </ion-card-header>

            <ion-card-content>
                <form (ngSubmit)="onLogin()">
                    <ion-item>
                        <ion-input label="Nombre de usuario" label-placement="floating" placeholder="Ej: cinéfilo123"
                            [(ngModel)]="username" name="username">
                        </ion-input>
                    </ion-item>

                    <ion-item>
                        <ion-input type="password" label="Contraseña" label-placement="floating" placeholder="••••••"
                            [(ngModel)]="password" name="password">
                        </ion-input>
                    </ion-item>

                    <ion-button type="submit" shape="round" expand="full" class="ion-margin-top color-primary">
                        🎟️ Iniciar Sesión
                    </ion-button>
                </form>
            </ion-card-content>
        </ion-card>
    </div>
</ion-content>
